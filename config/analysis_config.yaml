  spatial_folds: 5
  feature_shard_dtype: float32
  maximum_cached_pixels_per_unit: 9000
training:
  candidate_models:
  - xgboost
  - random_forest
  - hist_gradient_boosting
  final_ensemble_top_models: 2
  pixels_per_patch: 512
  maximum_training_pixels: 1200000
  maximum_validation_pixels: 300000
  positive_negative_ratio: 1.5
  minimum_valid_spatial_folds: 3
  minimum_positive_validation_pixels: 20
  minimum_negative_validation_pixels: 20
  threshold_grid:
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.4
  - 0.45
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  selection_weights:
    iou: 0.3
    f1: 0.25
    pr_auc: 0.2
    calibration: 0.1
    area_accuracy: 0.1
    negative_control: 0.05
  xgboost:
    n_estimators: 700
    max_depth: 8
    learning_rate: 0.04
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 4
    reg_alpha: 0.1
    reg_lambda: 1.0
    tree_method: hist
    n_jobs: 2
  random_forest:
    n_estimators: 600
    max_depth: 24
    min_samples_leaf: 2
    max_features: sqrt
    n_jobs: 2
  hist_gradient_boosting:
    max_iter: 500
    learning_rate: 0.05
    max_leaf_nodes: 63
    l2_regularization: 0.1
  calibration_sample_max_pixels: 2000000
  calibration_max_negative_pixels_per_unit: 150000
  calibration_max_positive_pixels_per_unit: 250000
ccdc:
  mode: annual_composite_harmonic_break
  minimum_observations: 6
  harmonic_order: 1
  break_minimum_segment_years: 3
  break_z_threshold: 2.5
  indices:
  - NDVI
  - NDMI
  - NDBI
  - BSI
  - TC_Brightness
  - PV_Spectral_Evidence
  - LSMA_HA
  - LSMA_LA
  - LSMA_VG
  - LSMA_SH
  - LSMA_RMSE
  causal_inference: true
  note: Annual composites support a CCDC-inspired harmonic break model, not canonical
    dense-observation CCDC.
  continuous_observations_for_break: 6
  object_deployment_year_aggregation: mode_of_pixel_break_years
pavg:
  name: PV-adjusted greenness anomaly
  metrics:
  - NDVI
  - EVI
  - TC_Greenness
  control_zone: context_3000_5000m
  minimum_core_pixels: 30
  minimum_control_pixels: 60
  climate_residualization: true
  bootstrap_repetitions: 1000
  interpretation: PV-footprint-scale greenness anomaly; Landsat 30 m cannot isolate
    vegetation directly beneath individual panels.
