  optional_historical_label_root: /home/wsy/pv_nature_experiment/input_tables/historical_pv_labels
  output_root: /home/wsy/pv_nature_experiment/output_v24_22_novelty_gated_remote_change
  cache_root: /home/wsy/pv_nature_experiment/cache_v24_22_novelty_gated_remote_change
  log_root: /home/wsy/pv_nature_experiment/logs_v24_22_novelty_gated_remote_change
  model_root: /home/wsy/pv_nature_experiment/models_v24_22_novelty_gated_remote_change
  future_constraint_root: /home/wsy/pv_nature_experiment/input_tables/future_constraints_30m
  expert_corrections_root: /home/wsy/pv_nature_experiment/input_tables/expert_pv_corrections
study:
  id_start: 1
  id_end: 142
  start_year: 2011
  end_year: 2025
  reference_year: 2024
  future_year: 2050
  require_complete_unit_year_matrix: true
  selected_unit_ids: []
processing:
  run_mode: v24_22_full_142_novelty_gated_remote_change
  show_progress: true
  fail_fast: true
  workers: 2
  raster_block_size: 256
  compress: DEFLATE
  overwrite: false
  deterministic: true
  device: cpu
  foreground_default: true
  maximum_working_memory_gb: 4.0
  per_unit_checkpoints: true
  allow_scientific_gate_failure: true
  verify_output_coverage_after_each_stage: true
landsat:
  filename_patterns:
  - Landsat_ChinaDesert_{year}.tif
  - '*{year}*.tif'
  expected_band_count: 6
  band_order:
  - BLUE
  - GREEN
  - RED
  - NIR
  - SWIR1
  - SWIR2
  nodata_values:
  - -9999
  - -32768
  - 65535
  reflectance_mode: auto
  source_resolution_min_m: 20.0
  source_resolution_max_m: 40.0
  source_resolution_tolerance_m: 0.5
  minimum_valid_fraction: 0.1
native_grid:
  target_resolution_m: 30.0
  projected_crs_mode: auto_utm
  alignment_anchor_m: 30.0
  reflectance_resampling: bilinear
  categorical_resampling: nearest
  maximum_output_dimension: 50000
  write_aligned_annual_rasters: true
  fail_on_non_30m_output: true
supervision:
  id_field: Id
  fractional_rasterization_oversample: 8
  strong_positive_fraction: 0.7
  weak_positive_fraction: 0.0
  ambiguous_outer_buffer_m: 0
  hard_negative_min_distance_m: 500
  minimum_positive_pixels_per_patch: 6
  adaptive_positive_fraction_floor: 0.015625
  minimum_positive_regions: 3
  ignore_value: 255
  use_weak_positive_weighting: true
  split:
    train_fraction: 0.7
    calibration_fraction: 0.15
    test_fraction: 0.15
    minimum_positive_train_units: 5
    minimum_positive_calibration_units: 3
    minimum_positive_test_units: 3
    stratify_by_positive_area: true
  outside_shp_semantics: unlabelled within 120 m boundary band; far outside is negative
    in 2024
  hard_negative_evidence_quantile: 0.1
  reference_year_positive_sufficient_condition: true
  reference_year_complete_inventory_assumed: true
  explicit_confuser_hard_negative_enabled: true
  water_hard_negative_threshold: 0.88
  vegetation_hard_negative_threshold: 0.9
  builtup_hard_negative_threshold: 0.92
  bare_hard_negative_threshold: 0.94
  confuser_maximum_pv_spectral_evidence: 0.2
  exact_inventory_binary_rule: any_fractional_overlap_manual_prior
  exact_inventory_minimum_fraction: 0.0
  fraction_weighted_area_accounting: true
  boundary_uncertainty_enabled: true
  boundary_uncertainty_buffer_m: 120.0
  boundary_core_erosion_m: 60.0
  boundary_core_minimum_fraction: 0.75
features:
  channels:
  - BLUE
  - GREEN
  - RED
  - NIR
  - SWIR1
  - SWIR2
  - NDVI
  - EVI
  - NDMI
  - NDBI
  - MNDWI
  - BSI
  - TC_Brightness
  - TC_Greenness
  - TC_Wetness
  - PV_Spectral_Evidence
  - LSMA_HA
  - LSMA_LA
  - LSMA_VG
  - LSMA_SH
  - LSMA_RMSE
  - PV_Fraction_Evidence
  - Water_Evidence
  - Vegetation_Evidence
  - Builtup_Evidence
  - Bare_Evidence
  - PV_Confuser_Penalty
