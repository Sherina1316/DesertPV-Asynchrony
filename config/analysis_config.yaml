  positive_patch_oversample: 3
  maximum_negative_to_positive_ratio: 2.0
  maximum_patches_per_unit: 180
  minimum_valid_fraction: 0.7
  minimum_valid_pixels_per_patch: 32
  allow_training_unit_exclusion: true
  minimum_training_regions: 5
  low_valid_label_policy: preserve_positive_then_adapt_negative_fraction
